[workspace]
members = ["crates/core", "crates/meshharbor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
axum = "0.8.9"
clap = { version = "4.5.61", features = ["derive", "env"] }
futures-util = "0.3"
rusqlite = { version = "0.38.0", features = ["bundled"] }
rmcp = { version = "3.9.0", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
meshopt = "0.7.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
remesh = "=0.0.5"

