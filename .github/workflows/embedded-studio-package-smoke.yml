name: MeshHarbor build and Studio smoke

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload unsigned CI build candidates for download
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - ".cargo/**"
      - ".gitattributes"
      - ".github/workflows/embedded-studio-package-smoke.yml"
      - ".github/workflows/studio-client-validation.yml"
      - "apps/studio/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES.md"
      - "crates/**"
      - "registry/**"
      - "runtimes/**"
      - "scripts/embedded-studio-test-server.mjs"
      - "scripts/package_ci_binary.ps1"
      - "scripts/smoke_embedded_studio.mjs"
  pull_request:
    branches:
      - main
    paths:
      - ".cargo/**"
      - ".gitattributes"
      - ".github/workflows/embedded-studio-package-smoke.yml"
      - ".github/workflows/studio-client-validation.yml"
      - "apps/studio/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES.md"
      - "crates/**"
      - "registry/**"
      - "runtimes/**"
      - "scripts/embedded-studio-test-server.mjs"
      - "scripts/package_ci_binary.ps1"
      - "scripts/smoke_embedded_studio.mjs"

permissions:
  contents: read

jobs:
  packaged-studio-smoke:
    name: Build and smoke-test ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
      CFLAGS: ${{ endsWith(matrix.target, '-msvc') && '/std:c11' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            arch: x64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            arch: arm64
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            arch: x64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            arch: arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            arch: x64
          - target: aarch64-apple-darwin
            runner: macos-15
            arch: arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            arch: x64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        if: ${{ !endsWith(matrix.target, '-musl') }}
        uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759
        with:
          targets: ${{ matrix.target }}

      - name: Install pinned NASM for Windows x64 AWS-LC build
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nasm-3.02-win64.zip'
          Invoke-WebRequest -Uri 'https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip' -OutFile $archive -TimeoutSec 60
          $expectedSha256 = '161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7'
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw 'NASM archive checksum mismatch.' }
          $nasmRoot = Join-Path $env:RUNNER_TEMP 'nasm-toolchain'
          Expand-Archive -LiteralPath $archive -DestinationPath $nasmRoot -Force
          $nasmDirectory = Join-Path $nasmRoot 'nasm-3.02'
          $nasmExecutable = Join-Path $nasmDirectory 'nasm.exe'
          if (!(Test-Path $nasmExecutable)) { throw 'Pinned NASM executable is missing.' }
          & $nasmExecutable -v
          if ($LASTEXITCODE -ne 0) { throw 'Pinned NASM version check failed.' }
          $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build release CLI with the checked-in Studio bundle
        if: ${{ !endsWith(matrix.target, '-musl') }}
        shell: pwsh
        run: cargo +1.88.0 build --locked --release --target $env:TARGET --package meshharbor --bin meshharbor

      - name: Build and check the static Linux musl CLI
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          docker build --tag meshharbor-musl-builder - <<'DOCKERFILE'
          FROM rust:1.88.0-alpine3.22@sha256:9dfaae478ecd298b6b5a039e1f2cc4fc040fc818a2de9aa78fa714dea036574d
          RUN apk add --no-cache build-base cmake
          DOCKERFILE
          docker run --rm --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --env CARGO_HOME=/tmp/cargo \
            --env CC=gcc --env CXX=g++ --env CXXSTDLIB_STATIC=1 \
            --env RUSTFLAGS='-C target-feature=+crt-static' \
            --mount "type=bind,source=$PWD,target=/work" --workdir /work \
            meshharbor-musl-builder \
            cargo build --locked --release --target "$TARGET" --package meshharbor --bin meshharbor

          readelf --program-headers --dynamic "target/$TARGET/release/meshharbor" > "$RUNNER_TEMP/meshharbor-elf.txt"
          if grep -Eq 'INTERP|NEEDED' "$RUNNER_TEMP/meshharbor-elf.txt"; then
            cat "$RUNNER_TEMP/meshharbor-elf.txt"
            echo "The musl binary must not require a dynamic loader or shared libraries." >&2
            exit 1
          fi

      - name: Test data-directory lock behavior
        if: ${{ !endsWith(matrix.target, '-musl') }}
        shell: pwsh
        run: cargo +1.88.0 test --locked --release --target $env:TARGET --package meshharbor --bin meshharbor data_dir_lock::tests

      - name: Test Windows case-only CLI output aliases
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo +1.88.0 test --locked --release --target $env:TARGET --package meshharbor --bin meshharbor cli_output_paths_reject_windows_case_only_aliases

      - name: Test Windows background service helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo +1.88.0 test --locked --release --target $env:TARGET --package meshharbor --bin meshharbor service::windows::tests

      - name: Smoke-test Windows task registration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "./target/$env:TARGET/release/meshharbor.exe"
          $dataDir = Join-Path $env:RUNNER_TEMP 'MeshHarbor service smoke'
          $installArgs = @('--data-dir', $dataDir, 'service', 'install', '--listen', '127.0.0.1:17432')
          & $binary @installArgs
          if ($LASTEXITCODE -ne 0) { throw 'Windows service installation failed.' }
          try {
            & $binary @installArgs
            if ($LASTEXITCODE -ne 0) { throw 'Windows service reinstallation was not idempotent.' }
            $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            $task = Get-ScheduledTask -TaskPath '\' -TaskName "MeshHarbor-$sid"
            if ($task.Principal.LogonType -ne 'Interactive' -or $task.State -ne 'Ready') {
              throw 'Expected a login task that is not started yet.'
            }
          } finally {
            & $binary service uninstall
            if ($LASTEXITCODE -ne 0) { throw 'Windows service cleanup failed.' }
          }

      - name: Install pinned Node.js for smoke tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.3
          architecture: ${{ matrix.arch }}

      - name: Package the CLI and smoke-test the extracted binary
        shell: pwsh
        run: ./scripts/package_ci_binary.ps1 -Target $env:TARGET

      - name: Upload unsigned CI build candidate
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meshharbor-ci-${{ matrix.target }}
          path: |
            target/ci-packages/meshharbor-${{ matrix.target }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
            target/ci-packages/meshharbor-${{ matrix.target }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

      - name: Install pinned pnpm for browser tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          package_json_file: apps/studio/package.json

      - name: Install locked browser test dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: apps/studio
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install headless Chromium for Studio regression
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: apps/studio
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Verify Studio workflows in Chromium
        id: studio_browser_regression
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: apps/studio
        env:
          MESHHARBOR_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/meshharbor
        run: pnpm run test:e2e

      - name: Collect Studio regression diagnostics
        if: failure() && steps.studio_browser_regression.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-browser-regression
          path: apps/studio/test-results/
          if-no-files-found: ignore
          retention-days: 7
