name: Embedded Studio package smoke

on:
  push:
    branches:
      - main
      - feat/embedded-studio-package-smoke
    paths:
      - ".github/workflows/embedded-studio-package-smoke.yml"
      - ".github/workflows/studio-client-validation.yml"
      - "apps/studio/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "runtimes/pixal3d/**"
      - "scripts/smoke_embedded_studio.mjs"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/embedded-studio-package-smoke.yml"
      - ".github/workflows/studio-client-validation.yml"
      - "apps/studio/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "runtimes/pixal3d/**"
      - "scripts/smoke_embedded_studio.mjs"

permissions:
  contents: read

jobs:
  packaged-studio-smoke:
    name: Build and launch embedded Studio (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15
          - platform: windows
            runner: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.3

      - name: Install locked Studio dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/studio

      - name: Build Studio production bundle
        run: npm run build
        working-directory: apps/studio

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759

      - name: Install pinned NASM for Windows AWS-LC build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nasm-3.02-win64.zip'
          Invoke-WebRequest -Uri 'https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip' -OutFile $archive -TimeoutSec 60
          $expectedSha256 = '161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7'
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw 'NASM archive checksum mismatch.' }
          $nasmRoot = Join-Path $env:RUNNER_TEMP 'nasm-toolchain'
          Expand-Archive -LiteralPath $archive -DestinationPath $nasmRoot -Force
          $nasmDirectory = Join-Path $nasmRoot 'nasm-3.02'
          $nasmExecutable = Join-Path $nasmDirectory 'nasm.exe'
          if (!(Test-Path $nasmExecutable)) { throw 'Pinned NASM executable is missing.' }
          & $nasmExecutable -v
          if ($LASTEXITCODE -ne 0) { throw 'Pinned NASM version check failed.' }
          $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build release CLI with embedded Studio
        env:
          CFLAGS: ${{ runner.os == 'Windows' && '/std:c11' || '' }}
        run: cargo build --locked --release --package meshharbor --bin meshharbor

      - name: Test data-directory lock behavior
        env:
          CFLAGS: ${{ runner.os == 'Windows' && '/std:c11' || '' }}
        run: cargo test --locked --release --package meshharbor --bin meshharbor data_dir_lock::tests

      - name: Test Windows case-only CLI output aliases
        if: runner.os == 'Windows'
        env:
          CFLAGS: ${{ runner.os == 'Windows' && '/std:c11' || '' }}
        run: cargo test --locked --release --package meshharbor --bin meshharbor cli_output_paths_reject_windows_case_only_aliases

      - name: Launch binary and verify embedded Studio assets
        shell: bash
        env:
          MESHHARBOR_BINARY: target/release/meshharbor${{ runner.os == 'Windows' && '.exe' || '' }}
        run: node scripts/smoke_embedded_studio.mjs "$MESHHARBOR_BINARY"
