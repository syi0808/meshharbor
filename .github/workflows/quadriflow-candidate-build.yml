name: QuadriFlow manual build and attestation candidate

on:
  workflow_dispatch:
    inputs:
      confirm_candidate:
        description: Build and attest temporary binaries only; no release or installer activation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-candidate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    name: ${{ matrix.platform }} unprivileged pinned-source build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            executable: quadriflow
          - os: macos-14
            platform: macos-aarch64
            executable: quadriflow
          - os: windows-2022
            platform: windows-x86_64
            executable: quadriflow.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the selected MeshHarbor main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libeigen3-dev libboost-dev

      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install eigen boost

      - name: Install native build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root) { $root = 'C:\vcpkg' }
          if (-not (Test-Path "$root\vcpkg.exe")) { throw "vcpkg not found at $root" }
          & "$root\vcpkg.exe" install eigen3:x64-windows-static boost:x64-windows-static
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed with exit code $LASTEXITCODE" }
          "VCPKG_INSTALLATION_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.8"
          cache: false

      - name: Build pinned QuadriFlow source without running the executable
        env:
          MESHHARBOR_SOURCE_COMMIT: ${{ github.sha }}
          MESHHARBOR_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          MESHHARBOR_WORKFLOW_PATH: .github/workflows/quadriflow-candidate-build.yml
          MESHHARBOR_BUILD_TRIGGER: ${{ github.event_name }}
          MESHHARBOR_PLATFORM: ${{ matrix.platform }}
        run: python scripts/quadriflow-platform-smoke.py --build-only

      - name: Upload the unverified candidate for the isolated signer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quadriflow-unverified-${{ matrix.platform }}
          path: ${{ runner.temp }}/quadriflow-platform-smoke/artifact/
          if-no-files-found: error
          retention-days: 1

  sign-candidate:
    needs: build-candidate
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    name: ${{ matrix.platform }} isolated candidate signer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            executable: quadriflow
          - platform: macos-aarch64
            executable: quadriflow
          - platform: windows-x86_64
            executable: quadriflow.exe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact workflow source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.8"
          cache: false

      - name: Download the unverified candidate without executing it
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quadriflow-unverified-${{ matrix.platform }}
          path: ${{ runner.temp }}/quadriflow-candidate/artifact

      - name: Validate candidate metadata and prepare pinned SLSA materials
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/quadriflow-candidate/artifact
          CANDIDATE_EXECUTABLE: ${{ matrix.executable }}
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
          PREDICATE_PATH: ${{ runner.temp }}/quadriflow-candidate/provenance.json
          MESHHARBOR_SOURCE_COMMIT: ${{ github.sha }}
          MESHHARBOR_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          MESHHARBOR_WORKFLOW_RUN_ID: ${{ github.run_id }}
          MESHHARBOR_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
        run: >-
          python scripts/quadriflow_candidate_provenance.py prepare
          --repository-root "$GITHUB_WORKSPACE"
          --candidate-dir "$CANDIDATE_DIR"
          --executable "$CANDIDATE_EXECUTABLE"
          --source-commit "$MESHHARBOR_SOURCE_COMMIT"
          --workflow-commit "$MESHHARBOR_WORKFLOW_COMMIT"
          --workflow-run-id "$MESHHARBOR_WORKFLOW_RUN_ID"
          --workflow-run-attempt "$MESHHARBOR_WORKFLOW_RUN_ATTEMPT"
          --platform "$CANDIDATE_PLATFORM"
          --output "$PREDICATE_PATH"

      - name: Create the candidate attestation using the isolated signer
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/quadriflow-candidate/artifact/${{ matrix.executable }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/quadriflow-candidate/provenance.json
          push-to-registry: false
          create-storage-record: false
          show-summary: false

      - name: Stage the bundle for isolated verification
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/quadriflow-candidate/artifact
          CANDIDATE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$CANDIDATE_BUNDLE" "$CANDIDATE_DIR/provenance.sigstore.json"

      - name: Upload the signed temporary candidate for verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quadriflow-signed-${{ matrix.platform }}
          path: ${{ runner.temp }}/quadriflow-candidate/artifact/
          if-no-files-found: error
          retention-days: 1

  verify-candidate:
    needs: sign-candidate
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    name: ${{ matrix.platform }} fresh isolated candidate verification
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            executable: quadriflow
          - platform: macos-aarch64
            executable: quadriflow
          - platform: windows-x86_64
            executable: quadriflow.exe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact source commit without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.8"
          cache: false

      - name: Download the signed candidate without executing it
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quadriflow-signed-${{ matrix.platform }}
          path: ${{ runner.temp }}/quadriflow-candidate/artifact

      - name: Verify signature, workflow identity, source, materials and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIR: ${{ runner.temp }}/quadriflow-candidate/artifact
          CANDIDATE_EXECUTABLE: ${{ matrix.executable }}
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
          MESHHARBOR_SOURCE_COMMIT: ${{ github.sha }}
          MESHHARBOR_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          MESHHARBOR_WORKFLOW_RUN_ID: ${{ github.run_id }}
          MESHHARBOR_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
        run: >-
          python scripts/quadriflow_attestation_verify.py verify
          --artifact "$CANDIDATE_DIR/$CANDIDATE_EXECUTABLE"
          --bundle "$CANDIDATE_DIR/provenance.sigstore.json"
          --source-commit "$MESHHARBOR_SOURCE_COMMIT"
          --workflow-commit "$MESHHARBOR_WORKFLOW_COMMIT"
          --workflow-run-id "$MESHHARBOR_WORKFLOW_RUN_ID"
          --workflow-run-attempt "$MESHHARBOR_WORKFLOW_RUN_ATTEMPT"
          --platform "$CANDIDATE_PLATFORM"
          --output "$CANDIDATE_DIR/verification.json"

      - name: Upload verified temporary candidate evidence (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quadriflow-candidate-${{ matrix.platform }}-${{ runner.arch }}
          path: ${{ runner.temp }}/quadriflow-candidate/artifact/
          if-no-files-found: error
          retention-days: 7
