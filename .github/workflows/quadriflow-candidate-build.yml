name: QuadriFlow manual build and attestation candidate

on:
  workflow_dispatch:
    inputs:
      confirm_candidate:
        description: Build and attest temporary binaries only; no release or installer activation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build_linux_primary:
    name: Linux primary unprivileged pinned-source build
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    uses: ./.github/workflows/quadriflow-candidate-build-reusable.yml
    with:
      runner: ubuntu-24.04
      platform: linux-x86_64
      replica: primary
      source_commit: ${{ github.sha }}
      workflow_commit: ${{ github.workflow_sha }}
      build_trigger: ${{ github.event_name }}

  build_linux_independent:
    name: Linux independent unprivileged pinned-source build
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    uses: ./.github/workflows/quadriflow-candidate-build-reusable.yml
    with:
      runner: ubuntu-24.04
      platform: linux-x86_64
      replica: independent
      source_commit: ${{ github.sha }}
      workflow_commit: ${{ github.workflow_sha }}
      build_trigger: ${{ github.event_name }}

  build_macos_primary:
    name: macOS primary unprivileged pinned-source build
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    uses: ./.github/workflows/quadriflow-candidate-build-reusable.yml
    with:
      runner: macos-14
      platform: macos-aarch64
      replica: primary
      source_commit: ${{ github.sha }}
      workflow_commit: ${{ github.workflow_sha }}
      build_trigger: ${{ github.event_name }}

  build_macos_independent:
    name: macOS independent unprivileged pinned-source build
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    uses: ./.github/workflows/quadriflow-candidate-build-reusable.yml
    with:
      runner: macos-14
      platform: macos-aarch64
      replica: independent
      source_commit: ${{ github.sha }}
      workflow_commit: ${{ github.workflow_sha }}
      build_trigger: ${{ github.event_name }}

  build_windows_primary:
    name: Windows primary unprivileged pinned-source build
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    uses: ./.github/workflows/quadriflow-candidate-build-reusable.yml
    with:
      runner: windows-2022
      platform: windows-x86_64
      replica: primary
      source_commit: ${{ github.sha }}
      workflow_commit: ${{ github.workflow_sha }}
      build_trigger: ${{ github.event_name }}

  build_windows_independent:
    name: Windows independent unprivileged pinned-source build
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    uses: ./.github/workflows/quadriflow-candidate-build-reusable.yml
    with:
      runner: windows-2022
      platform: windows-x86_64
      replica: independent
      source_commit: ${{ github.sha }}
      workflow_commit: ${{ github.workflow_sha }}
      build_trigger: ${{ github.event_name }}

  sign-candidate:
    needs:
      - build_linux_primary
      - build_linux_independent
      - build_macos_primary
      - build_macos_independent
      - build_windows_primary
      - build_windows_independent
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    name: ${{ matrix.platform }} isolated candidate signer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            executable: quadriflow
          - platform: macos-aarch64
            executable: quadriflow
          - platform: windows-x86_64
            executable: quadriflow.exe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact workflow source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.8"
          cache: false

      - name: Select and validate immutable build artifact IDs
        id: select_artifact_ids
        env:
          MESHHARBOR_PLATFORM: ${{ matrix.platform }}
          LINUX_PRIMARY_ARTIFACT_ID: ${{ needs.build_linux_primary.outputs.artifact_id }}
          LINUX_INDEPENDENT_ARTIFACT_ID: ${{ needs.build_linux_independent.outputs.artifact_id }}
          MACOS_PRIMARY_ARTIFACT_ID: ${{ needs.build_macos_primary.outputs.artifact_id }}
          MACOS_INDEPENDENT_ARTIFACT_ID: ${{ needs.build_macos_independent.outputs.artifact_id }}
          WINDOWS_PRIMARY_ARTIFACT_ID: ${{ needs.build_windows_primary.outputs.artifact_id }}
          WINDOWS_INDEPENDENT_ARTIFACT_ID: ${{ needs.build_windows_independent.outputs.artifact_id }}
        run: |
          case "$MESHHARBOR_PLATFORM" in
            linux-x86_64)
              primary="$LINUX_PRIMARY_ARTIFACT_ID"
              independent="$LINUX_INDEPENDENT_ARTIFACT_ID"
              ;;
            macos-aarch64)
              primary="$MACOS_PRIMARY_ARTIFACT_ID"
              independent="$MACOS_INDEPENDENT_ARTIFACT_ID"
              ;;
            windows-x86_64)
              primary="$WINDOWS_PRIMARY_ARTIFACT_ID"
              independent="$WINDOWS_INDEPENDENT_ARTIFACT_ID"
              ;;
            *)
              echo "Unsupported candidate platform: $MESHHARBOR_PLATFORM" >&2
              exit 1
              ;;
          esac

          if [[ ! "$primary" =~ ^[1-9][0-9]*$ || ! "$independent" =~ ^[1-9][0-9]*$ ]]; then
            echo "Build jobs did not return valid immutable artifact IDs" >&2
            exit 1
          fi
          if [[ "$primary" == "$independent" ]]; then
            echo "Primary and independent build artifact IDs must be distinct" >&2
            exit 1
          fi

          printf 'primary=%s\nindependent=%s\n' "$primary" "$independent" >> "$GITHUB_OUTPUT"

      - name: Download the primary unverified candidate by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.select_artifact_ids.outputs.primary }}
          path: ${{ runner.temp }}/quadriflow-candidate/primary
          merge-multiple: true

      - name: Download the independent build by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.select_artifact_ids.outputs.independent }}
          path: ${{ runner.temp }}/quadriflow-candidate/independent
          merge-multiple: true

      - name: Verify independent build identity and prepare pinned SLSA materials
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/quadriflow-candidate/primary
          INDEPENDENT_CANDIDATE_DIR: ${{ runner.temp }}/quadriflow-candidate/independent
          CANDIDATE_EXECUTABLE: ${{ matrix.executable }}
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
          PREDICATE_PATH: ${{ runner.temp }}/quadriflow-candidate/provenance.json
          MESHHARBOR_SOURCE_COMMIT: ${{ github.sha }}
          MESHHARBOR_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          MESHHARBOR_WORKFLOW_RUN_ID: ${{ github.run_id }}
          MESHHARBOR_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/quadriflow_candidate_provenance.py prepare
          --repository-root "$GITHUB_WORKSPACE"
          --candidate-dir "$CANDIDATE_DIR"
          --independent-candidate-dir "$INDEPENDENT_CANDIDATE_DIR"
          --executable "$CANDIDATE_EXECUTABLE"
          --source-commit "$MESHHARBOR_SOURCE_COMMIT"
          --workflow-commit "$MESHHARBOR_WORKFLOW_COMMIT"
          --workflow-run-id "$MESHHARBOR_WORKFLOW_RUN_ID"
          --workflow-run-attempt "$MESHHARBOR_WORKFLOW_RUN_ATTEMPT"
          --platform "$CANDIDATE_PLATFORM"
          --output "$PREDICATE_PATH"

      - name: Create the candidate attestation using the isolated signer
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/quadriflow-candidate/primary/${{ matrix.executable }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/quadriflow-candidate/provenance.json
          push-to-registry: false
          create-storage-record: false
          show-summary: false

      - name: Stage the bundle for isolated verification
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/quadriflow-candidate/primary
          CANDIDATE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$CANDIDATE_BUNDLE" "$CANDIDATE_DIR/provenance.sigstore.json"

      - name: Upload the signed temporary candidate for verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quadriflow-signed-${{ matrix.platform }}
          path: ${{ runner.temp }}/quadriflow-candidate/primary/
          if-no-files-found: error
          retention-days: 1

  verify-candidate:
    needs: sign-candidate
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    name: ${{ matrix.platform }} fresh isolated candidate verification
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            executable: quadriflow
          - platform: macos-aarch64
            executable: quadriflow
          - platform: windows-x86_64
            executable: quadriflow.exe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact source commit without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.8"
          cache: false

      - name: Download the signed candidate without executing it
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quadriflow-signed-${{ matrix.platform }}
          path: ${{ runner.temp }}/quadriflow-candidate/artifact

      - name: Verify signature, workflow identity, source, materials and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIR: ${{ runner.temp }}/quadriflow-candidate/artifact
          CANDIDATE_EXECUTABLE: ${{ matrix.executable }}
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
          MESHHARBOR_SOURCE_COMMIT: ${{ github.sha }}
          MESHHARBOR_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          MESHHARBOR_WORKFLOW_RUN_ID: ${{ github.run_id }}
          MESHHARBOR_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/quadriflow_attestation_verify.py verify
          --artifact "$CANDIDATE_DIR/$CANDIDATE_EXECUTABLE"
          --bundle "$CANDIDATE_DIR/provenance.sigstore.json"
          --source-commit "$MESHHARBOR_SOURCE_COMMIT"
          --workflow-commit "$MESHHARBOR_WORKFLOW_COMMIT"
          --workflow-run-id "$MESHHARBOR_WORKFLOW_RUN_ID"
          --workflow-run-attempt "$MESHHARBOR_WORKFLOW_RUN_ATTEMPT"
          --platform "$CANDIDATE_PLATFORM"
          --output "$CANDIDATE_DIR/verification.json"

      - name: Upload verified temporary candidate evidence (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quadriflow-candidate-${{ matrix.platform }}-${{ runner.arch }}
          path: ${{ runner.temp }}/quadriflow-candidate/artifact/
          if-no-files-found: error
          retention-days: 7
