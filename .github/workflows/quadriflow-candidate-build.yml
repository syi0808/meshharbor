name: QuadriFlow manual build and attestation candidate

on:
  workflow_dispatch:
    inputs:
      confirm_candidate:
        description: Build and attest temporary binaries only; no release or installer activation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build_linux_primary:
    name: Linux primary unprivileged pinned-source build
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    uses: ./.github/workflows/quadriflow-candidate-build-reusable.yml
    with:
      runner: ubuntu-24.04
      platform: linux-x86_64
      replica: primary
      source_commit: ${{ github.sha }}
      workflow_commit: ${{ github.workflow_sha }}
      build_trigger: ${{ github.event_name }}

  build_linux_independent:
    name: Linux independent unprivileged pinned-source build
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    uses: ./.github/workflows/quadriflow-candidate-build-reusable.yml
    with:
      runner: ubuntu-24.04
      platform: linux-x86_64
      replica: independent
      source_commit: ${{ github.sha }}
      workflow_commit: ${{ github.workflow_sha }}
      build_trigger: ${{ github.event_name }}

  build_macos_primary:
    name: macOS primary unprivileged pinned-source build
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    uses: ./.github/workflows/quadriflow-candidate-build-reusable.yml
    with:
      runner: macos-15
      platform: macos-aarch64
      replica: primary
      source_commit: ${{ github.sha }}
      workflow_commit: ${{ github.workflow_sha }}
      build_trigger: ${{ github.event_name }}

  build_macos_independent:
    name: macOS independent unprivileged pinned-source build
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    uses: ./.github/workflows/quadriflow-candidate-build-reusable.yml
    with:
      runner: macos-15
      platform: macos-aarch64
      replica: independent
      source_commit: ${{ github.sha }}
      workflow_commit: ${{ github.workflow_sha }}
      build_trigger: ${{ github.event_name }}

  build_windows_primary:
    name: Windows primary unprivileged pinned-source build
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    uses: ./.github/workflows/quadriflow-candidate-build-reusable.yml
    with:
      runner: windows-2022
      platform: windows-x86_64
      replica: primary
      source_commit: ${{ github.sha }}
      workflow_commit: ${{ github.workflow_sha }}
      build_trigger: ${{ github.event_name }}

  build_windows_independent:
    name: Windows independent unprivileged pinned-source build
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    uses: ./.github/workflows/quadriflow-candidate-build-reusable.yml
    with:
      runner: windows-2022
      platform: windows-x86_64
      replica: independent
      source_commit: ${{ github.sha }}
      workflow_commit: ${{ github.workflow_sha }}
      build_trigger: ${{ github.event_name }}

  pre-sign-gate:
    needs:
      - build_linux_primary
      - build_linux_independent
      - build_macos_primary
      - build_macos_independent
      - build_windows_primary
      - build_windows_independent
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    name: Verify all platform build pairs before signing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact workflow source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.8"

      - name: Validate all six immutable build artifact IDs
        env:
          LINUX_PRIMARY_ARTIFACT_ID: ${{ needs.build_linux_primary.outputs.artifact_id }}
          LINUX_INDEPENDENT_ARTIFACT_ID: ${{ needs.build_linux_independent.outputs.artifact_id }}
          MACOS_PRIMARY_ARTIFACT_ID: ${{ needs.build_macos_primary.outputs.artifact_id }}
          MACOS_INDEPENDENT_ARTIFACT_ID: ${{ needs.build_macos_independent.outputs.artifact_id }}
          WINDOWS_PRIMARY_ARTIFACT_ID: ${{ needs.build_windows_primary.outputs.artifact_id }}
          WINDOWS_INDEPENDENT_ARTIFACT_ID: ${{ needs.build_windows_independent.outputs.artifact_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re

          names = (
              "LINUX_PRIMARY_ARTIFACT_ID",
              "LINUX_INDEPENDENT_ARTIFACT_ID",
              "MACOS_PRIMARY_ARTIFACT_ID",
              "MACOS_INDEPENDENT_ARTIFACT_ID",
              "WINDOWS_PRIMARY_ARTIFACT_ID",
              "WINDOWS_INDEPENDENT_ARTIFACT_ID",
          )
          artifact_ids = [os.environ[name] for name in names]
          if any(re.fullmatch(r"[1-9][0-9]*", value) is None for value in artifact_ids):
              raise SystemExit("All six build jobs must return positive decimal artifact IDs")
          if len(set(artifact_ids)) != len(artifact_ids):
              raise SystemExit("All six build jobs must return distinct immutable artifact IDs")
          PY
          mkdir -p "$RUNNER_TEMP/quadriflow-pre-sign-gate/materials"

      - name: Download Linux primary build by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build_linux_primary.outputs.artifact_id }}
          path: ${{ runner.temp }}/quadriflow-pre-sign-gate/linux-primary

      - name: Download Linux independent build by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build_linux_independent.outputs.artifact_id }}
          path: ${{ runner.temp }}/quadriflow-pre-sign-gate/linux-independent

      - name: Download macOS primary build by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build_macos_primary.outputs.artifact_id }}
          path: ${{ runner.temp }}/quadriflow-pre-sign-gate/macos-primary

      - name: Download macOS independent build by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build_macos_independent.outputs.artifact_id }}
          path: ${{ runner.temp }}/quadriflow-pre-sign-gate/macos-independent

      - name: Download Windows primary build by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build_windows_primary.outputs.artifact_id }}
          path: ${{ runner.temp }}/quadriflow-pre-sign-gate/windows-primary

      - name: Download Windows independent build by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build_windows_independent.outputs.artifact_id }}
          path: ${{ runner.temp }}/quadriflow-pre-sign-gate/windows-independent

      - name: Validate all platform provenance and byte-identical replica pairs without executing candidates
        env:
          MESHHARBOR_SOURCE_COMMIT: ${{ github.sha }}
          MESHHARBOR_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          MESHHARBOR_WORKFLOW_RUN_ID: ${{ github.run_id }}
          MESHHARBOR_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python scripts/quadriflow_candidate_provenance.py prepare \
            --repository-root "$GITHUB_WORKSPACE" \
            --candidate-dir "$RUNNER_TEMP/quadriflow-pre-sign-gate/linux-primary" \
            --independent-candidate-dir "$RUNNER_TEMP/quadriflow-pre-sign-gate/linux-independent" \
            --executable quadriflow \
            --source-commit "$MESHHARBOR_SOURCE_COMMIT" \
            --workflow-commit "$MESHHARBOR_WORKFLOW_COMMIT" \
            --workflow-run-id "$MESHHARBOR_WORKFLOW_RUN_ID" \
            --workflow-run-attempt "$MESHHARBOR_WORKFLOW_RUN_ATTEMPT" \
            --platform linux-x86_64 \
            --output "$RUNNER_TEMP/quadriflow-pre-sign-gate/materials/linux-provenance.json"
          python scripts/quadriflow_candidate_provenance.py prepare \
            --repository-root "$GITHUB_WORKSPACE" \
            --candidate-dir "$RUNNER_TEMP/quadriflow-pre-sign-gate/macos-primary" \
            --independent-candidate-dir "$RUNNER_TEMP/quadriflow-pre-sign-gate/macos-independent" \
            --executable quadriflow \
            --source-commit "$MESHHARBOR_SOURCE_COMMIT" \
            --workflow-commit "$MESHHARBOR_WORKFLOW_COMMIT" \
            --workflow-run-id "$MESHHARBOR_WORKFLOW_RUN_ID" \
            --workflow-run-attempt "$MESHHARBOR_WORKFLOW_RUN_ATTEMPT" \
            --platform macos-aarch64 \
            --output "$RUNNER_TEMP/quadriflow-pre-sign-gate/materials/macos-provenance.json"
          python scripts/quadriflow_candidate_provenance.py prepare \
            --repository-root "$GITHUB_WORKSPACE" \
            --candidate-dir "$RUNNER_TEMP/quadriflow-pre-sign-gate/windows-primary" \
            --independent-candidate-dir "$RUNNER_TEMP/quadriflow-pre-sign-gate/windows-independent" \
            --executable quadriflow.exe \
            --source-commit "$MESHHARBOR_SOURCE_COMMIT" \
            --workflow-commit "$MESHHARBOR_WORKFLOW_COMMIT" \
            --workflow-run-id "$MESHHARBOR_WORKFLOW_RUN_ID" \
            --workflow-run-attempt "$MESHHARBOR_WORKFLOW_RUN_ATTEMPT" \
            --platform windows-x86_64 \
            --output "$RUNNER_TEMP/quadriflow-pre-sign-gate/materials/windows-provenance.json"

  sign-candidate:
    needs:
      - build_linux_primary
      - build_linux_independent
      - build_macos_primary
      - build_macos_independent
      - build_windows_primary
      - build_windows_independent
      - pre-sign-gate
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    name: ${{ matrix.platform }} isolated candidate signer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            executable: quadriflow
          - platform: macos-aarch64
            executable: quadriflow
          - platform: windows-x86_64
            executable: quadriflow.exe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact workflow source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.8"

      - name: Select and validate immutable build artifact IDs
        id: select_artifact_ids
        env:
          MESHHARBOR_PLATFORM: ${{ matrix.platform }}
          LINUX_PRIMARY_ARTIFACT_ID: ${{ needs.build_linux_primary.outputs.artifact_id }}
          LINUX_INDEPENDENT_ARTIFACT_ID: ${{ needs.build_linux_independent.outputs.artifact_id }}
          MACOS_PRIMARY_ARTIFACT_ID: ${{ needs.build_macos_primary.outputs.artifact_id }}
          MACOS_INDEPENDENT_ARTIFACT_ID: ${{ needs.build_macos_independent.outputs.artifact_id }}
          WINDOWS_PRIMARY_ARTIFACT_ID: ${{ needs.build_windows_primary.outputs.artifact_id }}
          WINDOWS_INDEPENDENT_ARTIFACT_ID: ${{ needs.build_windows_independent.outputs.artifact_id }}
        run: |
          case "$MESHHARBOR_PLATFORM" in
            linux-x86_64)
              primary="$LINUX_PRIMARY_ARTIFACT_ID"
              independent="$LINUX_INDEPENDENT_ARTIFACT_ID"
              ;;
            macos-aarch64)
              primary="$MACOS_PRIMARY_ARTIFACT_ID"
              independent="$MACOS_INDEPENDENT_ARTIFACT_ID"
              ;;
            windows-x86_64)
              primary="$WINDOWS_PRIMARY_ARTIFACT_ID"
              independent="$WINDOWS_INDEPENDENT_ARTIFACT_ID"
              ;;
            *)
              echo "Unsupported candidate platform: $MESHHARBOR_PLATFORM" >&2
              exit 1
              ;;
          esac

          if [[ ! "$primary" =~ ^[1-9][0-9]*$ || ! "$independent" =~ ^[1-9][0-9]*$ ]]; then
            echo "Build jobs did not return valid immutable artifact IDs" >&2
            exit 1
          fi
          if [[ "$primary" == "$independent" ]]; then
            echo "Primary and independent build artifact IDs must be distinct" >&2
            exit 1
          fi

          printf 'primary=%s\nindependent=%s\n' "$primary" "$independent" >> "$GITHUB_OUTPUT"

      - name: Download the primary unverified candidate by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.select_artifact_ids.outputs.primary }}
          path: ${{ runner.temp }}/quadriflow-candidate/primary
          merge-multiple: true

      - name: Download the independent build by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.select_artifact_ids.outputs.independent }}
          path: ${{ runner.temp }}/quadriflow-candidate/independent
          merge-multiple: true

      - name: Verify independent build identity and prepare pinned SLSA materials
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/quadriflow-candidate/primary
          INDEPENDENT_CANDIDATE_DIR: ${{ runner.temp }}/quadriflow-candidate/independent
          CANDIDATE_EXECUTABLE: ${{ matrix.executable }}
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
          PREDICATE_PATH: ${{ runner.temp }}/quadriflow-candidate/provenance.json
          MESHHARBOR_SOURCE_COMMIT: ${{ github.sha }}
          MESHHARBOR_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          MESHHARBOR_WORKFLOW_RUN_ID: ${{ github.run_id }}
          MESHHARBOR_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/quadriflow_candidate_provenance.py prepare
          --repository-root "$GITHUB_WORKSPACE"
          --candidate-dir "$CANDIDATE_DIR"
          --independent-candidate-dir "$INDEPENDENT_CANDIDATE_DIR"
          --executable "$CANDIDATE_EXECUTABLE"
          --source-commit "$MESHHARBOR_SOURCE_COMMIT"
          --workflow-commit "$MESHHARBOR_WORKFLOW_COMMIT"
          --workflow-run-id "$MESHHARBOR_WORKFLOW_RUN_ID"
          --workflow-run-attempt "$MESHHARBOR_WORKFLOW_RUN_ATTEMPT"
          --platform "$CANDIDATE_PLATFORM"
          --output "$PREDICATE_PATH"

      - name: Create the candidate attestation using the isolated signer
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/quadriflow-candidate/primary/${{ matrix.executable }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/quadriflow-candidate/provenance.json
          push-to-registry: false
          create-storage-record: false
          show-summary: false

      - name: Stage the bundle for isolated verification
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/quadriflow-candidate/primary
          CANDIDATE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$CANDIDATE_BUNDLE" "$CANDIDATE_DIR/provenance.sigstore.json"

      - name: Upload the signed temporary candidate for verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quadriflow-signed-${{ matrix.platform }}
          path: ${{ runner.temp }}/quadriflow-candidate/primary/
          if-no-files-found: error
          retention-days: 1

  verify-candidate:
    needs: sign-candidate
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    name: ${{ matrix.platform }} fresh isolated candidate verification
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            executable: quadriflow
          - platform: macos-aarch64
            executable: quadriflow
          - platform: windows-x86_64
            executable: quadriflow.exe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact source commit without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.8"

      - name: Download the signed candidate without executing it
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quadriflow-signed-${{ matrix.platform }}
          path: ${{ runner.temp }}/quadriflow-candidate/artifact

      - name: Verify signature, workflow identity, source, materials and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIR: ${{ runner.temp }}/quadriflow-candidate/artifact
          CANDIDATE_EXECUTABLE: ${{ matrix.executable }}
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
          MESHHARBOR_SOURCE_COMMIT: ${{ github.sha }}
          MESHHARBOR_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          MESHHARBOR_WORKFLOW_RUN_ID: ${{ github.run_id }}
          MESHHARBOR_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/quadriflow_attestation_verify.py verify
          --artifact "$CANDIDATE_DIR/$CANDIDATE_EXECUTABLE"
          --bundle "$CANDIDATE_DIR/provenance.sigstore.json"
          --source-commit "$MESHHARBOR_SOURCE_COMMIT"
          --workflow-commit "$MESHHARBOR_WORKFLOW_COMMIT"
          --workflow-run-id "$MESHHARBOR_WORKFLOW_RUN_ID"
          --workflow-run-attempt "$MESHHARBOR_WORKFLOW_RUN_ATTEMPT"
          --platform "$CANDIDATE_PLATFORM"
          --output "$CANDIDATE_DIR/verification.json"

      - name: Upload verified temporary candidate evidence (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quadriflow-candidate-${{ matrix.platform }}-${{ runner.arch }}
          path: ${{ runner.temp }}/quadriflow-candidate/artifact/
          if-no-files-found: error
          retention-days: 7

  native-smoke:
    needs: verify-candidate
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_candidate == true }}
    name: ${{ matrix.platform }} native exact signed-digest smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            executable: quadriflow
          - platform: macos-aarch64
            runner: macos-15
            executable: quadriflow
          - platform: windows-x86_64
            runner: windows-2022
            executable: quadriflow.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact source commit without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.8"

      - name: Install native runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libeigen3-dev libboost-dev

      - name: Install native runtime dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install eigen boost

      - name: Resolve the exact signed artifact ID
        id: select_signed_artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_ARTIFACT_NAME: quadriflow-signed-${{ matrix.platform }}
        run: |
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/quadriflow-run-artifacts.json"
          python scripts/quadriflow_artifact_id.py \
            "$RUNNER_TEMP/quadriflow-run-artifacts.json" \
            --name "$SIGNED_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Download the signed candidate by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.select_signed_artifact.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/quadriflow-native-candidate

      - name: Verify the same signed executable and bundle on this OS
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIR: ${{ runner.temp }}/quadriflow-native-candidate
          CANDIDATE_EXECUTABLE: ${{ matrix.executable }}
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
          MESHHARBOR_SOURCE_COMMIT: ${{ github.sha }}
          MESHHARBOR_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          MESHHARBOR_WORKFLOW_RUN_ID: ${{ github.run_id }}
          MESHHARBOR_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/quadriflow_attestation_verify.py verify
          --artifact "$CANDIDATE_DIR/$CANDIDATE_EXECUTABLE"
          --bundle "$CANDIDATE_DIR/provenance.sigstore.json"
          --source-commit "$MESHHARBOR_SOURCE_COMMIT"
          --workflow-commit "$MESHHARBOR_WORKFLOW_COMMIT"
          --workflow-run-id "$MESHHARBOR_WORKFLOW_RUN_ID"
          --workflow-run-attempt "$MESHHARBOR_WORKFLOW_RUN_ATTEMPT"
          --platform "$CANDIDATE_PLATFORM"
          --output "$CANDIDATE_DIR/verification.json"

      - name: Run the already-verified candidate with a minimal environment
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/quadriflow-native-candidate
          NATIVE_SMOKE_DIR: ${{ runner.temp }}/quadriflow-native-smoke
          MESHHARBOR_PLATFORM: ${{ matrix.platform }}
          MESHHARBOR_SOURCE_COMMIT: ${{ github.sha }}
          MESHHARBOR_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          MESHHARBOR_WORKFLOW_RUN_ID: ${{ github.run_id }}
          MESHHARBOR_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/quadriflow_candidate_native_smoke.py
          --artifact-dir "$CANDIDATE_DIR"
          --output-dir "$NATIVE_SMOKE_DIR"
          --platform "$MESHHARBOR_PLATFORM"
          --source-commit "$MESHHARBOR_SOURCE_COMMIT"
          --workflow-commit "$MESHHARBOR_WORKFLOW_COMMIT"
          --workflow-run-id "$MESHHARBOR_WORKFLOW_RUN_ID"
          --workflow-run-attempt "$MESHHARBOR_WORKFLOW_RUN_ATTEMPT"

      - name: Ensure the candidate did not modify the checked-out source
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short
            echo "Candidate modified the source checkout during native smoke" >&2
            exit 1
          fi

      - name: Install pinned Rust toolchain for the MeshHarbor output validator
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - name: Validate native quad output through MeshHarbor core
        env:
          MESHHARBOR_QUADRIFLOW_OBJ_OUTPUT: ${{ runner.temp }}/quadriflow-native-smoke/cube-quad.obj
        run: cargo test -p meshharbor-core --locked --test quadriflow_output -- --ignored --nocapture

      - name: Upload native smoke diagnostics (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quadriflow-native-smoke-${{ matrix.platform }}
          path: ${{ runner.temp }}/quadriflow-native-smoke/*.json
          if-no-files-found: error
          retention-days: 7
