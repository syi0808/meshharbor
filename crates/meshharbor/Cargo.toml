[package]
name = "meshharbor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "meshharbor"
path = "src/main.rs"

[[bin]]
name = "meshharbor-retopo-worker"
path = "src/bin/retopology_worker.rs"
required-features = ["experimental-retopology-worker"]

[features]
default = []
bundled-quadriflow = ["dep:meshharbor-quadriflow-sys", "meshharbor-quadriflow-sys/native"]
experimental-retopology-worker = ["dep:remesh"]

[dependencies]
axum.workspace = true
clap.workspace = true
http-body-util.workspace = true
meshharbor-core = { path = "../core" }
meshharbor-quadriflow-sys = { path = "../quadriflow-sys", optional = true }
rmcp.workspace = true
remesh = { workspace = true, optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
