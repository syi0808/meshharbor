[package]
name = "meshharbor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "meshharbor"
path = "src/main.rs"

[[bin]]
name = "meshharbor-retopo-worker"
path = "src/bin/retopology_worker.rs"
required-features = ["experimental-retopology-worker"]

[features]
default = []
experimental-retopology-worker = ["dep:remesh"]

[dependencies]
axum.workspace = true
clap.workspace = true
http-body-util.workspace = true
meshharbor-core = { path = "../core" }
rmcp.workspace = true
remesh = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Globalization"] }
